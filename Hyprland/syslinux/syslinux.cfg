# Nyarch Hyprland — SYSLINUX configuration (BIOS boot)
DEFAULT archiso
LABEL archiso
    LINUX ../%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD ../%INSTALL_DIR%/boot/intel-ucode.img,../%INSTALL_DIR%/boot/amd-ucode.img,../%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ISO_LABEL% loglevel=3 quiet splash
    SAY Nyarch Hyprland (BIOS)
