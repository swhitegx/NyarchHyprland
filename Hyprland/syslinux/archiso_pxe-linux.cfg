# PXE boot
LABEL arch
TEXT HELP
Boot the Nyarch Hyprland install medium via PXE.
ENDTEXT
MENU LABEL Nyarch Hyprland (%ARCH%, PXE)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G copytoram=n ip=dhcp nouveau.modeset=1 radeon.modeset=1 i915.modeset=1 nvme_load=yes
