name: Build Nyarch Hyprland ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Check environment
        run: |
          pwd
          cat /etc/os-release
          find . -maxdepth 3 | head -40

      - name: Prepare build environment
        run: |
          pacman-key --init
          pacman --noconfirm -Sy archlinux-keyring grub

      - name: Add Chaotic-AUR
        run: bash Hyprland/install_chaotic.sh

      - name: Verify dotfiles are present
        run: |
          if [ -d "Hyprland/etc/skel/.nyarch-skel" ]; then
            echo "Dotfiles found: $(find Hyprland/etc/skel/.nyarch-skel -type f | wc -l) files"
          else
            echo "WARNING: Dotfiles not found. The ISO will ship with minimal skel."
          fi

      - name: Build ISO
        run: cd Hyprland && bash steps.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Nyarch Hyprland Live ISO
          path: /__w/NyarchHyprland/NyarchHyprland/Hyprland/out/*.iso
