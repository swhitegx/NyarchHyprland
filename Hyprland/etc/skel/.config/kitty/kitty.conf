# Nyarch Linux Hyprland — Kitty terminal emulator configuration
# Placeholder

font_family      JetBrainsMono Nerd Font
bold_font         auto
italic_font       auto
bold_italic_font  auto
font_size 11.0

background #262830
foreground #e0e0e8
selection_background #404050
selection_foreground #e0e0e8
url_color #90beff
cursor #90beff

# Black
color0 #262830
color8 #404050

# Red
color1 #e06c75
color9 #e06c75

# Green
color2  #98c379
color10 #98c379

# Yellow
color3  #d19a66
color11 #d19a66

# Blue
color4  #90beff
color12 #90beff

# Magenta
color5  #c678dd
color13 #c678dd

# Cyan
color6  #56b6c2
color14 #56b6c2

# White
color7  #abb2bf
color15 #e0e0e8

cursor_shape block
cursor_blink_interval 0
scrollback_lines 10000
mouse_hide_wait 3.0
shell .

tab_bar_style powerline
tab_bar_edge bottom
active_tab_foreground #262830
active_tab_background #90beff
inactive_tab_foreground #808090
inactive_tab_background #1c1e26

background_opacity 0.95
dynamic_background_opacity yes
