# Ignis generates this file from wallpaper — may not exist on first boot
# source=~/.cache/ignis/material/dark_colors-hyprland.conf

# Fallback colors for first boot
$primary = rgb(90beff)
$onSurface = rgb(e0e0e8)
$surface = rgb(262830)

general {
    col.active_border = $primary
    col.inactive_border = rgb(404050)
}
