# Nyarch Linux Hyprland — hyprlock configuration
# Placeholder

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

background {
    path = /usr/share/backgrounds/nyarch-hyprland-wallpaper.png
    blur_passes = 3
    blur_size = 8
}

input-field {
    size = 200, 50
    position = 0, -80
    monitor =
    dots_center = true
    fade_on_empty = true
    font_color = rgb(90beff)
    inner_color = rgb(262830)
    outer_color = rgb(404050)
    outline_thickness = 2
    placeholder_text = <i>Password...</i>
    shadow_passes = 2
}

