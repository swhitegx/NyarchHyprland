# Try to load Ignis-generated colors (may not exist on first boot)
# Ignis creates this after wallpaper is set
# source=~/.cache/ignis/material/dark_colors-hyprland.conf

# Fallback colors for first boot before Ignis generates theme
$primary = rgb(90beff)
$onSurface = rgb(e0e0e8)
$surface = rgb(262830)

general {
    col.active_border = $primary
    col.inactive_border = rgb(404050)
}
