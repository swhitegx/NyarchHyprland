# Nyarch Hyprland — Main Configuration
# Flat config (no source= includes) for reliability

# ═══════════════════════════════════════
# MONITOR
# ═══════════════════════════════════════
monitor = , preferred, auto, 1

# ═══════════════════════════════════════
# ENVIRONMENT
# ═══════════════════════════════════════
env = XCURSOR_SIZE,24
env = XDG_SESSION_TYPE,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt5ct
env = GTK_THEME,Material

# ═══════════════════════════════════════
# EXEC-ONCE
# ═══════════════════════════════════════
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hyprctl setcursor Adwaita 24

# ═══════════════════════════════════════
# COLORS (fallback; Ignis overrides via material cache at runtime)
# ═══════════════════════════════════════
$primary = rgb(90beff)
$onSurface = rgb(e0e0e8)
$surface = rgb(262830)

# ═══════════════════════════════════════
# INPUT
# ═══════════════════════════════════════
input {
    kb_layout = us
    kb_options = grp:win_space_toggle
    follow_mouse = 1
    accel_profile = flat
    sensitivity = 0
    touchpad {
        natural_scroll = no
    }
}

# ═══════════════════════════════════════
# GENERAL
# ═══════════════════════════════════════
general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2
    resize_on_border = true
    layout = dwindle
    col.active_border = $primary
    col.inactive_border = rgb(404050)
}

# ═══════════════════════════════════════
# DECORATION
# ═══════════════════════════════════════
decoration {
    rounding = 15
    blur {
        enabled = true
        size = 12
        passes = 4
    }
    shadow {
        enabled = true
        range = 30
        render_power = 4
        color = rgb(000000)
    }
}

# ═══════════════════════════════════════
# ANIMATIONS
# ═══════════════════════════════════════
animations {
    enabled = yes
    bezier = quart, 0.25, 1, 0.5, 1
    animation = windows, 1, 6, quart, slide
    animation = border, 1, 6, quart
    animation = borderangle, 1, 6, quart
    animation = fade, 1, 6, quart
    animation = workspaces, 1, 6, quart
}

# ═══════════════════════════════════════
# DWINDLE
# ═══════════════════════════════════════
dwindle {
    pseudotile = yes
    preserve_split = yes
}

# ═══════════════════════════════════════
# MISC
# ═══════════════════════════════════════
misc {
    disable_hyprland_logo = true
}

# ═══════════════════════════════════════
# WINDOW RULES
# ═══════════════════════════════════════
windowrule = float,^(pavucontrol)$
windowrule = pin,^(pavucontrol)$
windowrule = size 900 500,^(pavucontrol)$
windowrule = float,^(kitty)$
windowrule = size 640 400,^(kitty)$
windowrule = float,class:^(Material Settings)$
layerrule = blur,^(ignis_BAR.*)$
layerrule = noanim,^(ignis_NOTIFICATION_POPUP.*)$
layerrule = noanim,^(ignis_CONTROL_CENTER.*)$

# ═══════════════════════════════════════
# KEYBINDS
# ═══════════════════════════════════════
$mainMod = SUPER

# Window control
bind = $mainMod, C, killactive
bind = $mainMod SHIFT, M, exit
bind = $mainMod, V, togglefloating
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit
bind = ,F11, fullscreen, 0
bind = $mainMod, G, centerwindow
bind = $mainMod, D, pin

# Ignis
bind = $mainMod, X, exec, ignis toggle ignis_LAUNCHER
bind = $mainMod, M, exec, ignis toggle ignis_POWERMENU
bind = ALT, F4, exec, ignis toggle ignis_POWERMENU
bind = $mainMod, R, exec, ~/.config/ignis/scripts/recording.py start
bind = $mainMod SHIFT, R, exec, ~/.config/ignis/scripts/recording.py continue
bind = $mainMod, T, exec, ~/.config/ignis/scripts/recording.py stop
bind = $mainMod SHIFT, T, exec, ~/.config/ignis/scripts/recording.py pause

# Launch apps
bind = $mainMod, Q, exec, kitty
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, E, exec, thunar
bind = $mainMod SHIFT, S, exec, grimblast --notify --freeze copysave area
bind = $mainMod, S, exec, grimblast --notify --freeze copysave output
bind = ,PRINT, exec, grimblast --notify --freeze copysave output

# Focus control
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move windows
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move and resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media keys
bind = ,XF86AudioRaiseVolume, exec, pamixer -i 5
bind = ,XF86AudioLowerVolume, exec, pamixer -d 5
bind = ,XF86AudioMute, exec, pamixer -t
